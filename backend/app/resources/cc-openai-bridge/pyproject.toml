[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cc-openai-bridge"
version = "1.0.0"
description = "Standalone Anthropic Messages to OpenAI Responses bridge for Claude Code"
requires-python = ">=3.12,<3.14"
dependencies = [
  "litellm==1.105.1",
  "fastapi==0.143.1",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "openai==2.54.0",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
cc-openai-bridge = "cc_openai_bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_openai_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
