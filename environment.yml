# conda env create -f environment.yml
# 仅包含平台自身的依赖；训练框架（LLaMA-Factory / verl / TRL）与 Harbor
# 建议各自安装在独立环境中，并通过 backend/.env 里的 PRT_*_PYTHON 指定。
name: prt-ai-dl-factory
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - fastapi>=0.115
      - uvicorn[standard]>=0.30
      - pydantic>=2.9
      - pydantic-settings>=2.5
      - email-validator>=2.2
      - python-multipart>=0.0.9
      - PyJWT>=2.9
      - bcrypt>=4.2
      - psutil>=6.0
      - nvidia-ml-py>=12.560
      - PyYAML>=6.0
      - filelock>=3.15
      - aiofiles>=24.1
      - httpx>=0.27
      - python-dotenv>=1.0
      - toml>=0.10
      - orjson>=3.10
      # 开发/测试
      - pytest>=8.0
      - websockets>=13.0
